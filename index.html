<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0d"><title>THERON</title><style>
:root{color-scheme:dark;--bg:#0b0b0d;--panel:#17171a;--muted:#aaa8a9;--red:#b32432;--line:#303034}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f2f0ee;font-family:"Times New Roman",Times,serif;font-size:17px}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}header strong{font-size:28px;letter-spacing:3px}header small{display:block;font-size:11px;color:var(--red);letter-spacing:2px;text-align:center}.wrap{max-width:560px;margin:auto;padding-bottom:100px}main{padding:8px 18px}h1{font-size:34px;margin:15px 0 4px}h2{font-size:24px;margin:12px 0}h3{margin:0 0 10px;font-size:21px}.muted{color:var(--muted)}.small{font-size:14px}.card{background:var(--panel);border:1px solid #29292d;border-radius:12px;padding:17px;margin:13px 0}.hero{background:linear-gradient(120deg,#221013,#121214 65%);border-left:3px solid var(--red)}.btn{border:0;background:var(--red);color:white;border-radius:8px;padding:13px 16px;font-weight:bold}.btn.secondary{background:#29292e}.btn.ghost{background:transparent;border:1px solid #45454a}.btn:disabled{opacity:.45}.wide{width:100%}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wraprow{flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}.greek{height:12px;margin:7px 18px;background:repeating-linear-gradient(90deg,transparent 0 7px,#6b1a24 7px 9px,transparent 9px 17px);opacity:.55;mask-image:linear-gradient(90deg,transparent,black 12%,black 88%,transparent)}nav{position:fixed;bottom:0;left:0;right:0;background:#101013;border-top:1px solid #363035;display:flex;justify-content:center;padding:10px 5px calc(12px + env(safe-area-inset-bottom));z-index:3}nav button{width:24%;max-width:140px;background:none;border:0;color:#a6a4a5;padding:5px;font-size:16px}nav button.active{color:#e45b66}nav span{display:block;font-size:22px}input,select,textarea{width:100%;background:#0e0e11;border:1px solid #49464a;color:white;border-radius:7px;padding:10px}label{display:block;font-size:14px;color:#c4c0c1;margin:9px 0 4px}.set{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:end;margin:12px 0}.set input{min-width:0}.set button{height:42px;border-radius:7px;border:1px solid #5d5052;background:#282326;color:white}.set button.done{background:#21644d;border-color:#21644d}.pill{border:1px solid #554046;padding:5px 9px;border-radius:20px;color:#e2b2b6;font-size:13px}.notice{padding:12px;background:#201719;border-radius:8px;color:#dfc1c3;font-size:14px}.hide{display:none}.bar{height:8px;background:#35353a;border-radius:10px;overflow:hidden}.bar div{height:100%;background:var(--red)}.chat{height:310px;overflow:auto;border:1px solid #333;border-radius:10px;padding:12px;background:#111113}.bubble{margin:9px 0;padding:10px 12px;border-radius:10px;background:#252529;max-width:92%}.bubble.user{background:#431b21;margin-left:auto}.icon{font-size:25px;color:var(--red)}.tiny{font-size:12px;color:#aaa}a{color:#e4a0a7}hr{border:0;border-top:1px solid var(--line);margin:14px 0}

/* Welcome screen */
#welcome{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 35%,#2c1117 0%,#101013 42%,#080809 85%);display:flex;align-items:center;justify-content:center;padding:30px;color:#f2f0ee;text-align:center}
#welcome[hidden]{display:none}
.welcome-inner{width:min(100%,390px);display:flex;flex-direction:column;align-items:center;gap:15px}
.welcome-greek{font-size:clamp(48px,12vw,70px);letter-spacing:5px;line-height:1.1;font-weight:bold}
.welcome-name{font-size:23px;letter-spacing:8px}
.welcome-rule{height:2px;width:125px;background:#b32432;margin:8px auto}
.welcome-message{font-size:22px;letter-spacing:1px;margin:25px 0 30px}
.welcome-key{width:100%;height:15px;opacity:.65;background:repeating-linear-gradient(90deg,#76212b 0 3px,transparent 3px 9px,#76212b 9px 12px,transparent 12px 18px);mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
.welcome-enter{width:100%;max-width:260px;font-size:19px;padding:15px}
.welcome-replay{border:1px solid #544044;background:transparent;color:#e4c8cb;border-radius:7px;padding:8px 12px;font-size:14px;margin-top:12px}
 .set-extra{margin:0 0 13px 42px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.set-extra label{margin:0}.set-extra textarea{min-height:42px}.history-edit{border-top:1px solid #3a3437;padding-top:12px;margin-top:12px}.history-set{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.history-set .wide-field{grid-column:1/-1} </style><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="THERON"><link rel="apple-touch-icon" href="icon-192.png"></head><body><section id="welcome" role="dialog" aria-modal="true" aria-label="Welcome to THERON" hidden><div class="welcome-inner"><div class="welcome-key" aria-hidden="true"></div><div class="welcome-greek">ΘΗΡΩΝ</div><div class="welcome-name">THERON</div><div class="welcome-rule"></div><div class="welcome-message">WELCOME TO THE CHALLENGE.</div><button class="btn welcome-enter" id="enterTheron">BEGIN →</button><div class="welcome-key" aria-hidden="true"></div></div></section><div class="wrap"><header><div><strong>THERON</strong><small>ΘΗΡΩΝ</small></div><div class="muted small" id="today"></div></header><div class="greek"></div><div id="saveStatus" role="status" aria-live="polite" style="font-size:12px;color:#c9b6b8;padding:5px 0 0"></div><main id="view"></main></div><nav id="nav"><button data-page="home" class="active"><span>⌂</span>Home</button><button data-page="workout"><span>◉</span>Workout</button><button data-page="progress"><span>▥</span>Progress</button><button data-page="coach"><span>✦</span>Coach</button></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.75.0"></script><script src="config.js"></script><script>
let cloud=null;let cloudUser=null;let cloudReady=false;
const KEY='theron.v1';const WELCOME_KEY='theron.welcome.seen.v2';const base={history:[],active:null,next:'Push',minutes:45,split:'PPL',gym:'My Gym',equipment:'Full gym',activities:[],chat:[]};let state;try{state={...base,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...base}};let page='home';const $=id=>document.getElementById(id);let saveError='';let lastSavedAt=null;const save=()=>{try{const data=JSON.stringify(state);localStorage.setItem(KEY,data);if(localStorage.getItem(KEY)!==data)throw Error('Storage verification failed');saveError='';lastSavedAt=new Date();updateSaveStatus();if(cloudUser)clearTimeout(window._theronSyncTimer),window._theronSyncTimer=setTimeout(()=>syncCloud(),700);return true}catch(err){saveError='Device storage failed. Export a backup now.';updateSaveStatus();alert('THERON could not save your changes. Do not close the app. Export your workout backup and check device storage.');return false}};function updateSaveStatus(){const el=document.getElementById('saveStatus');if(el)el.textContent=saveError||((lastSavedAt?'Saved '+lastSavedAt.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'Local device storage · export backups regularly'))}window.addEventListener('pageshow',updateSaveStatus);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=()=>new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});$('today').textContent=date();
const catalog={Push:[['Flat Barbell Bench Press','Chest',2,'135'],['Incline Machine Chest Press','Upper chest',2,'160'],['Cable Lateral Raise','Shoulders',2,'25'],['Single-Arm Cable Triceps Pushdown','Triceps',2,'30'],['Hanging Knee Raise','Core',2,'0']],Pull:[['Lat Pulldown','Lats',2,'0'],['Chest-Supported Row','Back',2,'0'],['Reverse Pec Deck','Rear delts',2,'0'],['Dumbbell Curl','Biceps',2,'0'],['Hammer Curl','Biceps',2,'0']],Legs:[['Leg Press','Quads',2,'0'],['Romanian Deadlift','Posterior chain',2,'0'],['Leg Curl','Hamstrings',2,'0'],['Leg Extension','Quads',2,'0'],['Calf Raise','Calves',2,'0']]};const cycle=['Push','Pull','Legs'];const suggested=()=>state.next;function last(name){for(const w of [...state.history].reverse()){const e=w.exercises.find(x=>x.name===name);if(e)return e}return null}function makeWorkout(){if(state.active)return page='workout',render();const day=suggested();let arr=catalog[day].slice();if(state.minutes<=30)arr=arr.slice(0,3);if(state.minutes>=75)arr.push(...(day==='Push'?[['Overhead Dumbbell Press','Shoulders',2,'0']]:day==='Pull'?[['Back Extension','Posterior chain',2,'0']]:[['Seated Calf Raise','Calves',2,'0']]));state.active={id:Date.now(),date:new Date().toISOString(),day,minutes:state.minutes,exercises:arr.map(([name,muscle,n])=>({name,muscle,sets:Array.from({length:n},(_,i)=>{const prior=last(name)?.sets[i];return {weight:prior?.weight??'',reps:prior?.reps??'',done:false}})}))};save();page='workout';render()}

function accountMarkup(){
  if(!cloudReady) return `<div class="notice">Cloud sync is not configured yet. Your workouts remain on this device and your manual backup remains available.</div>`;
  if(cloudUser) return `<div class="small muted">Signed in as ${esc(cloudUser.email||'account')}</div><button class="btn secondary wide" style="margin-top:10px" onclick="signOutTheron()">Sign Out</button><button class="btn ghost wide" style="margin-top:8px" onclick="syncCloud()">Sync Now</button>`;
  return `<div class="small muted">Sign in once. THERON will keep local data and sync your own history securely.</div><label>Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"><button class="btn wide" style="margin-top:10px" onclick="sendMagicLink()">Send Sign-In Link</button>`;
}
function updateAccountUI(){const s=document.getElementById('accountStatus'),p=document.getElementById('syncPill'),b=document.getElementById('authBox');if(!s||!p||!b)return;if(cloudUser){s.textContent='Cloud sync enabled';p.textContent='SYNCED'}else if(cloudReady){s.textContent='Not signed in';p.textContent='LOCAL'}else{s.textContent='Device-only mode';p.textContent='LOCAL'}b.innerHTML=accountMarkup()}
async function initCloud(){try{const cfg=window.THERON_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY||!window.supabase)return;cloud=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});cloudReady=true;const {data}=await cloud.auth.getSession();cloudUser=data.session?.user||null;cloud.auth.onAuthStateChange(async (_event,session)=>{cloudUser=session?.user||null;updateAccountUI();if(cloudUser)await syncCloud();});updateAccountUI()}catch(e){console.warn('Cloud disabled',e);cloud=null;cloudReady=false;updateAccountUI()}}
async function sendMagicLink(){const email=document.getElementById('authEmail')?.value.trim();if(!email)return alert('Enter your email.');const {error}=await cloud.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});if(error)return alert('Could not send sign-in link: '+error.message);alert('Check your email for the THERON sign-in link.');}
async function signOutTheron(){await cloud.auth.signOut();cloudUser=null;updateAccountUI()}
function cloudWorkoutId(id){const raw=String(id);if(/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(raw))return raw;const hex=Array.from(new TextEncoder().encode(raw)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,32).padEnd(32,'0');return `${hex.slice(0,8)}-${hex.slice(8,12)}-4${hex.slice(13,16)}-8${hex.slice(17,20)}-${hex.slice(20,32)}`}
function workoutRows(){return state.history.map(w=>({id:cloudWorkoutId(w.id),user_id:cloudUser.id,workout_date:w.date,workout_name:w.day+' Day',workout_data:w}))}
async function syncCloud(){if(!cloudReady||!cloudUser)return false;try{const localRows=workoutRows();if(localRows.length){const {error}=await cloud.from('workouts').upsert(localRows,{onConflict:'id'});if(error)throw error}const {data:remote,error}=await cloud.from('workouts').select('id,workout_date,workout_data,updated_at').order('workout_date',{ascending:true});if(error)throw error;const byId=new Map(state.history.map(w=>[String(w.id),w]));for(const r of remote||[]){const w=r.workout_data;if(w&&w.id!=null&&!byId.has(String(w.id)))byId.set(String(w.id),w)}state.history=[...byId.values()].sort((a,b)=>new Date(a.date)-new Date(b.date));if(state.history.length){const lastDay=state.history[state.history.length-1].day;state.next=cycle[(cycle.indexOf(lastDay)+1)%3]}try{localStorage.setItem(KEY,JSON.stringify(state));lastSavedAt=new Date();updateSaveStatus()}catch(storageError){console.error('Local save failed',storageError)}updateAccountUI();render();return true}catch(e){console.error(e);alert('Cloud sync failed. Your local data is still here. Nothing was deleted.');return false}}
function showCloudNotice(){if(cloudReady&&!cloudUser)updateAccountUI()}
initCloud();
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const a=state.active;let html='';if(page==='home'){html=`<h1>Earn Your Progress.</h1><p class="muted">Train with purpose. Track every rep.</p><div class="card" id="accountCard"><div class="row"><div><h3 style="margin:0">Account & Sync</h3><div class="small muted" id="accountStatus">Device-only mode</div></div><span class="pill" id="syncPill">LOCAL</span></div><div id="authBox" style="margin-top:12px"></div></div><div class="card hero"><div class="small muted">${a?'SESSION IN PROGRESS':'NEXT WORKOUT'}</div><h1>${esc(a?.day||suggested())} Day</h1><p class="muted">${a?'Resume where you left off':`${state.minutes} minutes · Adaptive training`}</p><button class="btn wide" onclick="${a?'go(\'workout\')':'makeWorkout()'}">${a?'Resume Workout':'Start Workout'} →</button></div><div class="grid"><div class="card"><div class="icon">↗</div><h3>${state.history.length}</h3><div class="muted small">Completed sessions</div></div><div class="card"><div class="icon">◷</div><h3>${state.activities.length}</h3><div class="muted small">Logged activities</div></div></div><div class="card"><h3>Training settings</h3><label>Workout duration</label><select onchange="state.minutes=+this.value;save();render()">${[30,45,60,75,90].map(x=>`<option ${x===state.minutes?'selected':''}>${x}</option>`).join('')}</select><label>Gym profile</label><input value="${esc(state.gym)}" onchange="state.gym=this.value;save()"><label>Equipment</label><select onchange="state.equipment=this.value;save()">${['Full gym','Dumbbells and cables','Home / bodyweight'].map(x=>`<option ${state.equipment===x?'selected':''}>${x}</option>`).join('')}</select><p class="tiny">Rolling Push / Pull / Legs · Last completed workout determines what comes next.</p></div><div class="card"><h3>Daily activity</h3><div class="row"><select id="activityType"><option>Walking</option><option>Sports</option><option>Cardio</option><option>Mobility</option><option>Other</option></select><input id="activityMin" type="number" min="1" placeholder="Minutes" style="max-width:105px"><button class="btn" onclick="addActivity()">Add</button></div>${state.activities.slice(-3).reverse().map(x=>`<p class="small">${esc(x.type)} · ${x.minutes} min · ${esc(x.date)}</p>`).join('')}</div><div class="card"><button class="welcome-replay" onclick="showWelcome()">View welcome screen</button><br><br><button class="btn secondary wide" onclick="exportData()">Export Backup (JSON)</button><label>Restore backup</label><input type="file" accept="application/json" onchange="importData(this.files[0])"></div>`}
if(page==='workout'){if(!a)html=`<h1>Workout</h1><p class="muted">Your next session is ${suggested()} Day.</p><button class="btn wide" onclick="makeWorkout()">Start ${suggested()} Day</button>`;else{const done=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),total=a.exercises.reduce((n,e)=>n+e.sets.length,0);html=`<div class="row"><div><h1>${a.day} Day</h1><div class="muted small">${done} / ${total} working sets</div></div><span class="pill">${a.minutes} min plan</span></div><div class="bar"><div style="width:${100*done/total}%"></div></div><p class="notice">Log weight and reps, then tap ✓. Your session saves on this device. Export backups regularly; device storage is not permanent cloud backup.</p>`+a.exercises.map((e,i)=>`<div class="card"><div class="row"><div><h3>${esc(e.name)}</h3><div class="muted small">${esc(e.muscle)} · ${last(e.name)?'Previous: '+last(e.name).sets.map(s=>`${s.weight}×${s.reps}`).join(', '):'First logged session'}</div></div><button class="btn ghost" onclick="replaceExercise(${i})">Swap</button></div>${e.sets.map((s,j)=>`<div class="set"><div>${j+1}</div><div><label>lb / kg</label><input aria-label="Weight" inputmode="decimal" type="number" value="${esc(s.weight)}" onchange="editSet(${i},${j},'weight',this.value)"></div><div><label>Reps</label><input aria-label="Reps" inputmode="numeric" type="number" value="${esc(s.reps)}" onchange="editSet(${i},${j},'reps',this.value)"></div><button class="${s.done?'done':''}" onclick="toggleSet(${i},${j})">✓</button></div><div class="set-extra"><div><label>Variation (optional)</label><input placeholder="e.g. straight-leg + knee raise" value="${esc(s.variation||'')}" onchange="editSet(${i},${j},'variation',this.value)"></div><div><label>Set notes (optional)</label><input placeholder="e.g. 3 straight + 18 knee" value="${esc(s.notes||'')}" onchange="editSet(${i},${j},'notes',this.value)"></div></div>`).join('')}<div class="row"><button class="btn secondary" onclick="addSet(${i})">+ Set</button><button class="btn ghost" onclick="removeExercise(${i})">Remove</button></div></div>`).join('')+`<div class="card"><button class="btn wide" onclick="finishWorkout()">Finish Workout</button><button class="btn ghost wide" style="margin-top:10px" onclick="discardWorkout()">Discard Session</button></div>`}}
if(page==='progress'){let workouts=state.history;const sets=workouts.flatMap(w=>w.exercises.flatMap(e=>e.sets.filter(s=>s.done)));html=`<h1>Your Progress</h1><p class="muted">Real training data, no invented metrics.</p><div class="grid"><div class="card"><h2>${workouts.length}</h2><div class="small muted">Workouts</div></div><div class="card"><h2>${sets.length}</h2><div class="small muted">Completed sets</div></div></div><div class="card"><h3>Workout history</h3>${workouts.length?workouts.slice().reverse().map(w=>`<div><div class="row"><b>${esc(w.day)} Day</b><span class="small muted">${new Date(w.date).toLocaleDateString()}</span></div><p class="small muted">${w.exercises.map(e=>`${esc(e.name)}: ${e.sets.filter(s=>s.done).map(s=>`${esc(s.weight)} × ${esc(s.reps)}${s.variation?' ('+esc(s.variation)+')':''}${s.notes?' — '+esc(s.notes):''}`).join(' / ')}`).join('<br>')}</p><button class="btn secondary" onclick="editCompletedWorkout(${w.id})">Edit workout</button><hr></div>`).join(''):'<p class="muted">Finish a workout to start building your history.</p>'}</div><div class="card"><h3>Exercise history</h3><select id="historyExercise" onchange="showExerciseHistory(this.value)"><option value="">Choose exercise</option>${[...new Set(workouts.flatMap(w=>w.exercises.map(e=>e.name)))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select><div id="exerciseHistory"></div></div>`}
if(page==='coach'){html=`<h1>THERON Coach</h1><p class="muted">Workout-aware guidance</p><div class="notice">This first version has an on-device coaching assistant, not a connected AI model. It can reference your saved workouts and offer basic guidance.</div><div class="chat" id="chat">${state.chat.map(m=>`<div class="bubble ${m.who==='you'?'user':''}">${esc(m.text)}</div>`).join('')||'<div class="bubble">Ask about your next workout, previous sets, progression, rest, or exercise swaps.</div>'}</div><div class="row" style="margin-top:12px"><input id="question" placeholder="Ask THERON…" onkeydown="if(event.key==='Enter')ask()"><button class="btn" onclick="ask()">Send</button></div><div class="row wraprow" style="margin-top:12px"><button class="btn secondary" onclick="quickAsk('What is my next workout?')">Next workout</button><button class="btn secondary" onclick="quickAsk('How should I progress?')">Progression</button></div>`}
$('view').innerHTML=html;updateAccountUI();if(page==='coach'){let c=$('chat');c.scrollTop=c.scrollHeight}}

function editCompletedWorkout(id){const w=state.history.find(x=>x.id===id);if(!w)return;const container=document.getElementById('view');container.innerHTML=`<h1>Edit ${esc(w.day)} Day</h1><p class="notice">Changes save on this device. Export a fresh backup afterward.</p><div id="historyEditor">${w.exercises.map((e,i)=>`<div class="card"><h3>${esc(e.name)}</h3>${e.sets.map((set,j)=>`<div class="history-edit"><div class="small muted">Set ${j+1}</div><div class="history-set"><div><label>Weight</label><input type="number" inputmode="decimal" value="${esc(set.weight)}" onchange="editHistoricalSet(${id},${i},${j},'weight',this.value)"></div><div><label>Reps</label><input type="number" inputmode="numeric" value="${esc(set.reps)}" onchange="editHistoricalSet(${id},${i},${j},'reps',this.value)"></div><div class="wide-field"><label>Variation</label><input value="${esc(set.variation||'')}" placeholder="e.g. straight-leg + knee raise" onchange="editHistoricalSet(${id},${i},${j},'variation',this.value)"></div><div class="wide-field"><label>Set notes</label><textarea onchange="editHistoricalSet(${id},${i},${j},'notes',this.value)">${esc(set.notes||'')}</textarea></div></div></div>`).join('')}</div>`).join('')}</div><button class="btn wide" onclick="go('progress')">Done Editing</button>`}
function editHistoricalSet(id,i,j,k,value){const w=state.history.find(x=>x.id===id);if(!w||!w.exercises[i]||!w.exercises[i].sets[j])return;if(k==='reps'&&(!Number.isFinite(Number(value))||Number(value)<0))return alert('Enter valid reps.');if(k==='weight'&&(!Number.isFinite(Number(value))||Number(value)<0))return alert('Enter valid weight.');w.exercises[i].sets[j][k]=value;save()}
function go(p){page=p;render();updateSaveStatus()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));function editSet(i,j,k,v){state.active.exercises[i].sets[j][k]=v;save()}function toggleSet(i,j){let s=state.active.exercises[i].sets[j];if(!s.done&&(s.weight===''||s.reps===''||Number(s.reps)<=0)){alert('Enter weight and reps first. Use 0 for bodyweight.');return}s.done=!s.done;save();render()}function addSet(i){state.active.exercises[i].sets.push({weight:'',reps:'',done:false});save();render()}function removeExercise(i){if(confirm('Remove this exercise?')){state.active.exercises.splice(i,1);save();render()}}function replaceExercise(i){let e=state.active.exercises[i],name=prompt('Replacement exercise name:',e.name);if(!name||!name.trim())return;e.name=name.trim();e.sets=e.sets.map(()=>({weight:'',reps:'',done:false}));save();render()}function finishWorkout(){let a=state.active;if(!a.exercises.some(e=>e.sets.some(s=>s.done))){alert('Complete at least one set first.');return}if(!confirm('Finish and save this workout?'))return;a.exercises=a.exercises.map(e=>({...e,sets:e.sets.filter(s=>s.done)})).filter(e=>e.sets.length);state.history.push(a);state.next=cycle[(cycle.indexOf(a.day)+1)%3];state.active=null;save();go('progress')}function discardWorkout(){if(confirm('Discard the current session? This cannot be undone.')){state.active=null;save();render()}}function addActivity(){let type=$('activityType').value,minutes=Number($('activityMin').value);if(!minutes||minutes<1)return alert('Enter minutes.');state.activities.push({type,minutes,date:date()});save();render()}function showExerciseHistory(name){$('exerciseHistory').innerHTML=state.history.slice().reverse().flatMap(w=>w.exercises.filter(e=>e.name===name).map(e=>`<p class="small">${new Date(w.date).toLocaleDateString()} — ${e.sets.map(s=>`${esc(s.weight)} × ${esc(s.reps)}`).join(' / ')}</p>`)).join('')||'<p class="muted">No records yet.</p>'}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='theron-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(file){if(!file)return;try{let x=JSON.parse(await file.text());if(!Array.isArray(x.history)||!confirm('Replace all local THERON data with this backup?'))return;if(x.history.some(w=>!w||!Array.isArray(w.exercises)))throw Error('Invalid workout history');const oldState=state;state={...base,...x};if(!save()){state=oldState;return}render();updateSaveStatus()}catch(err){alert('Could not import backup: '+(err?.message||'invalid file'))}}function quickAsk(q){$('question').value=q;ask()}function ask(){const q=$('question').value.trim();if(!q)return;const t=q.toLowerCase();let ans;if(t.includes('next')||t.includes('today'))ans=`Your next rolling workout is ${state.active?.day||state.next} Day. ${state.active?'You have an active session to finish.':'You can start it on Home.'}`;else if(t.includes('progress')||t.includes('weight')||t.includes('overload'))ans=`You have ${state.history.length} completed workouts saved. Compare your last two performances for the same exercise before adding load. Add reps or weight when execution remains controlled; don't force an increase every session.`;else if(t.includes('rest'))ans='A useful starting point is 2–3 minutes for demanding compound lifts and 1–2 minutes for smaller isolation movements. Rest longer if performance needs it.';else if(t.includes('swap')||t.includes('equipment'))ans='Tap Swap beside an exercise to replace it. Note: automatic whole-workout rebalancing is planned for a later version.';else if(t.includes('failure'))ans='Training close to failure can be effective, but absolute failure is not necessary on every set. Keep technique and exercise safety first.';else ans='I can help with your next session, saved workout history, progression, rest, and substitutions. Full conversational AI coaching will require a later integration.';state.chat.push({who:'you',text:q},{who:'coach',text:ans});save();render()}render();
function showWelcome(){document.getElementById('welcome').hidden=false;document.getElementById('enterTheron').focus()}
document.getElementById('enterTheron').addEventListener('click',()=>{document.getElementById('welcome').hidden=true;try{localStorage.setItem(WELCOME_KEY,'yes')}catch{}});
try{if(localStorage.getItem(WELCOME_KEY)!=='yes')showWelcome()}catch{showWelcome()}
if(location.protocol==='https:'&&'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
